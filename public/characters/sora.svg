<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Sora — Resistance Netrunner">
  <defs>
    <linearGradient id="sora-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#04131d"/>
      <stop offset="55%" stop-color="#071926"/>
      <stop offset="100%" stop-color="#0d0b1a"/>
    </linearGradient>
    <radialGradient id="sora-halo" cx="0.52" cy="0.38" r="0.55">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#00a2cc" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sora-skin" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffe7dc"/>
      <stop offset="62%" stop-color="#f3c5b8"/>
      <stop offset="100%" stop-color="#be8582"/>
    </linearGradient>
    <linearGradient id="sora-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#193b52"/>
      <stop offset="48%" stop-color="#0e2030"/>
      <stop offset="100%" stop-color="#08111c"/>
    </linearGradient>
    <linearGradient id="sora-rim" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="65%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff2a6d" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="sora-visor" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.86"/>
      <stop offset="55%" stop-color="#00c8ff" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#62fff6" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="sora-jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142331"/>
      <stop offset="60%" stop-color="#0b131d"/>
      <stop offset="100%" stop-color="#06090f"/>
    </linearGradient>
    <linearGradient id="sora-eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#063b4c"/>
      <stop offset="55%" stop-color="#00c8e8"/>
      <stop offset="100%" stop-color="#90ffff"/>
    </linearGradient>
  </defs>

  <!-- Atmospheric backdrop & Ghost-Line telemetry grid -->
  <rect width="240" height="280" fill="url(#sora-bg)"/>
  <circle cx="124" cy="108" r="118" fill="url(#sora-halo)"/>
  <g stroke="#00f0ff" stroke-opacity="0.11" stroke-width="1">
    <path d="M0 44h240M0 88h240M0 132h240M0 176h240M0 220h240"/>
    <path d="M40 0v280M88 0v280M152 0v280M200 0v280"/>
  </g>
  <path d="M18 22h28l8 8M222 22h-26l-8 8" fill="none" stroke="#00f0ff" stroke-opacity="0.55" stroke-width="1.6"/>
  <circle cx="196" cy="48" r="18" fill="none" stroke="#00f0ff" stroke-opacity="0.24" stroke-dasharray="6 4" stroke-width="1.4"/>

  <!-- Back hair silhouette (asymmetric netrunner bob) -->
  <path d="M58 96 C46 132 48 176 62 204 L88 196 L176 196 C190 172 194 128 180 90 C168 54 142 38 114 40 C82 42 66 64 58 96Z" fill="url(#sora-hair)"/>
  <path d="M58 98 C49 130 51 168 63 198" fill="none" stroke="#00f0ff" stroke-width="2.6" stroke-opacity="0.85"/>
  <path d="M181 94 C191 124 189 162 178 192" fill="none" stroke="#ff2a6d" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Techwear high-collar jacket & shoulders -->
  <path d="M20 280 L34 226 C44 210 68 200 94 196 L146 196 C172 200 196 210 206 226 L220 280 Z" fill="url(#sora-jacket)"/>
  <!-- Inner synth-weave bodysuit -->
  <path d="M88 202 L152 202 L142 280 L98 280 Z" fill="#0d1822"/>
  <path d="M104 220 L136 220 L130 280 L110 280 Z" fill="#00f0ff" fill-opacity="0.14"/>
  <!-- High standing cyber-collar -->
  <path d="M68 182 L94 214 L92 264 L54 238 L58 196 Z" fill="#132230" stroke="#00f0ff" stroke-width="1.6"/>
  <path d="M172 182 L146 214 L148 264 L186 238 L182 196 Z" fill="#101b28" stroke="#00f0ff" stroke-opacity="0.65" stroke-width="1.5"/>
  <!-- Glowing circuit traces on jacket -->
  <g fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="square">
    <path d="M44 242 L74 242 L86 256 L86 280"/>
    <path d="M196 242 L166 242 L154 256 L154 280" stroke-opacity="0.7"/>
    <path d="M112 232 L128 232 M120 232 L120 268"/>
  </g>
  <rect x="64" y="196" width="8" height="4" transform="rotate(24 64 196)" fill="#00f0ff"/>
  <rect x="168" y="198" width="8" height="4" transform="rotate(-24 168 198)" fill="#ff2a6d"/>

  <!-- Neck & Collar shadow -->
  <path d="M103 164 L137 164 L141 208 L120 222 L99 208 Z" fill="url(#sora-skin)"/>
  <path d="M103 166 C112 178 128 178 137 166 L138 184 C126 192 114 192 102 184 Z" fill="#8f5d60" fill-opacity="0.52"/>
  <!-- Neural throat choker -->
  <path d="M101 190 Q120 197 139 190 L140 197 Q120 204 100 197 Z" fill="#09131c" stroke="#00f0ff" stroke-width="1.2"/>
  <rect x="116" y="192" width="8" height="4" rx="1" fill="#00f0ff"/>

  <!-- Anime Face Plane -->
  <path d="M76 102 C76 72 96 56 120 56 C144 56 164 72 164 102 C164 132 152 156 134 169 C126 175 114 175 106 169 C88 156 76 132 76 102 Z" fill="url(#sora-skin)"/>
  <!-- Cheek rim light & subtle blush -->
  <path d="M78 106 C78 132 89 153 107 167" fill="none" stroke="#8ffaff" stroke-width="2.2" stroke-opacity="0.8"/>
  <ellipse cx="95" cy="133" rx="9" ry="4.5" fill="#ff5c8a" fill-opacity="0.2"/>
  <ellipse cx="146" cy="133" rx="9" ry="4.5" fill="#ff5c8a" fill-opacity="0.2"/>

  <!-- Right Eye (uncovered, sharp expressive cyan) -->
  <g>
    <path d="M132 112 Q144 105 155 112 Q153 123 143 124 Q134 123 132 112 Z" fill="#f7feff"/>
    <ellipse cx="143" cy="115" rx="6.8" ry="7.4" fill="url(#sora-eye)"/>
    <ellipse cx="143" cy="115.5" rx="3.1" ry="3.6" fill="#041520"/>
    <circle cx="140.5" cy="112.2" r="2.2" fill="#ffffff"/>
    <circle cx="146.2" cy="118.2" r="1.1" fill="#b8ffff"/>
    <path d="M130 112 Q143 103 157 111 L155 108 Q143 101 131 109 Z" fill="#07131e"/>
    <path d="M134 124 Q144 126 152 123" fill="none" stroke="#8b5a5c" stroke-width="1.2"/>
    <!-- Eyebrow -->
    <path d="M131 100 Q144 95 156 99" fill="none" stroke="#0d2233" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Left Eye (visible behind translucent AR cyber-visor) -->
  <g>
    <path d="M85 112 Q96 105 108 112 Q106 123 97 124 Q87 123 85 112 Z" fill="#e9fcff"/>
    <ellipse cx="97" cy="115" rx="6.8" ry="7.4" fill="url(#sora-eye)"/>
    <ellipse cx="97" cy="115.5" rx="3.1" ry="3.6" fill="#041520"/>
    <circle cx="94.5" cy="112.2" r="2.2" fill="#ffffff"/>
    <path d="M83 111 Q97 103 110 112 L108 109 Q97 101 85 108 Z" fill="#07131e"/>
    <path d="M84 99 Q96 94 109 100" fill="none" stroke="#0d2233" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Nose & Confident Netrunner Smirk -->
  <path d="M119 121 L117 134 L122 136" fill="none" stroke="#b07675" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M109 149 Q120 153 133 146" fill="none" stroke="#945258" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M114 153 Q121 155 127 152" fill="none" stroke="#ffd8cf" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Translucent Cyan AR Tactical Half-Visor over Left Eye -->
  <g>
    <path d="M68 103 L116 104 L112 128 L73 126 Z" fill="url(#sora-visor)" stroke="#9affff" stroke-width="1.5"/>
    <path d="M74 108 L92 108 M76 122 L88 122" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.2"/>
    <circle cx="97" cy="115" r="9.2" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-dasharray="4 3" stroke-width="1"/>
    <path d="M106 115 h6 M97 105 v-3" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
  </g>

  <!-- Layered Front Bangs & Side Locks -->
  <path d="M68 92 C72 60 96 42 124 44 C152 46 172 64 174 96 C166 80 154 72 142 70 C146 84 143 98 134 108 C134 92 128 80 119 74 C118 90 110 104 98 112 C99 95 94 82 86 76 C83 94 76 112 66 126 C63 112 65 100 68 92 Z" fill="url(#sora-hair)"/>
  <!-- Hair sheen highlights -->
  <path d="M84 68 Q102 56 122 58 M132 60 Q149 64 160 76" fill="none" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Twin cyber hairpins -->
  <polygon points="148,76 164,71 162,76 146,81" fill="#00f0ff"/>
  <polygon points="150,84 163,80 161,84 148,88" fill="#ff2a6d"/>

  <!-- Ghost-Line Comms Headset & Boom Mic (Left Side) -->
  <g>
    <path d="M60 98 L73 94 L75 134 L60 130 Z" fill="#10202e" stroke="#00f0ff" stroke-width="1.8"/>
    <circle cx="67" cy="114" r="5.5" fill="#00f0ff"/>
    <circle cx="67" cy="114" r="2.5" fill="#ffffff"/>
    <path d="M67 128 Q74 152 104 155" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="101" y="152" width="8" height="5" rx="2" fill="#00f0ff"/>
  </g>

  <!-- Frame Corner Callsign Accent -->
  <path d="M10 270 L10 252 M10 270 L28 270" fill="none" stroke="#00f0ff" stroke-width="2"/>
</svg>
