<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Hana — Echo in the Amber">
  <defs>
    <linearGradient id="hana-bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#1f1406"/>
      <stop offset="55%" stop-color="#151018"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <radialGradient id="hana-halo" cx="0.5" cy="0.38" r="0.58">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#19ffc6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hana-skin" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#fff0e4"/>
      <stop offset="60%" stop-color="#f5cab8"/>
      <stop offset="100%" stop-color="#bd887b"/>
    </linearGradient>
    <linearGradient id="hana-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#61372c"/>
      <stop offset="55%" stop-color="#381d18"/>
      <stop offset="100%" stop-color="#1c0d0c"/>
    </linearGradient>
    <linearGradient id="hana-dress" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1f2d"/>
      <stop offset="60%" stop-color="#17111c"/>
      <stop offset="100%" stop-color="#0b080f"/>
    </linearGradient>
    <linearGradient id="hana-eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#593208"/>
      <stop offset="55%" stop-color="#ffb000"/>
      <stop offset="100%" stop-color="#ffe89e"/>
    </linearGradient>
  </defs>

  <!-- Komorebi Sunlit Amber Memory Backdrop -->
  <rect width="240" height="280" fill="url(#hana-bg)"/>
  <circle cx="120" cy="108" r="122" fill="url(#hana-halo)"/>
  <!-- Musical staff arcs & floating golden ginkgo motes -->
  <g fill="none" stroke="#ffb000" stroke-opacity="0.18" stroke-width="1.1">
    <path d="M10 72 Q120 44 230 78"/>
    <path d="M10 82 Q120 54 230 88"/>
    <path d="M10 92 Q120 64 230 98"/>
  </g>
  <g fill="#ffb000" fill-opacity="0.72">
    <path d="M36 52 C44 44 52 50 46 60 Z"/>
    <path d="M198 156 C208 148 214 156 204 166 Z"/>
    <circle cx="48" cy="154" r="2.5" fill="#19ffc6"/>
    <circle cx="192" cy="52" r="2.5" fill="#ffe49e"/>
  </g>

  <!-- Conservatory Cello Neck & Tuning Pegs behind right shoulder -->
  <g transform="translate(178, 52) rotate(14)">
    <rect x="-5" y="18" width="10" height="96" fill="#4a2416" stroke="#ffb000" stroke-width="1.4"/>
    <circle cx="0" cy="10" r="9" fill="#3a1b10" stroke="#ffb000" stroke-width="1.5"/>
    <circle cx="0" cy="10" r="3" fill="#ffb000"/>
    <line x1="-14" y1="24" x2="14" y2="24" stroke="#ffb000" stroke-width="2"/>
    <line x1="-14" y1="34" x2="14" y2="34" stroke="#ffb000" stroke-width="2"/>
    <line x1="-2" y1="18" x2="-2" y2="112" stroke="#ffe7a8" stroke-opacity="0.7" stroke-width="0.9"/>
    <line x1="2" y1="18" x2="2" y2="112" stroke="#ffe7a8" stroke-opacity="0.7" stroke-width="0.9"/>
  </g>

  <!-- Soft Wavy Chestnut Hair Back Layer -->
  <path d="M56 104 C50 62 78 36 120 36 C162 36 188 62 182 104 C190 144 186 188 172 222 L68 222 C54 188 50 144 56 104 Z" fill="url(#hana-hair)"/>
  <path d="M55 106 C50 142 54 182 67 216" fill="none" stroke="#ffb000" stroke-width="2.4" stroke-opacity="0.88"/>

  <!-- Old Kyoto Conservatory Blouse, Shawl & Amber Ribbon -->
  <path d="M22 280 L38 224 C50 206 76 196 100 192 L140 192 C164 196 190 206 202 224 L218 280 Z" fill="url(#hana-dress)"/>
  <path d="M92 194 L148 194 L138 280 L102 280 Z" fill="#f7efe4"/>
  <!-- Shawl lapels trimmed in warm gold -->
  <path d="M68 192 L102 232 L98 280 L54 252 Z" fill="#362438" stroke="#ffb000" stroke-width="1.5"/>
  <path d="M172 192 L138 232 L142 280 L186 252 Z" fill="#2c1d2e" stroke="#ffb000" stroke-width="1.5"/>
  <!-- Conservatory Amber Bow at Collar -->
  <polygon points="120,212 102,204 106,222" fill="#ffb000"/>
  <polygon points="120,212 138,204 134,222" fill="#ffb000"/>
  <path d="M116 214 L110 248 L118 244 L120 216 L122 244 L130 248 L124 214 Z" fill="#e09000"/>
  <circle cx="120" cy="212" r="4.5" fill="#fff0b8"/>

  <!-- Neck -->
  <path d="M105 162 L135 162 L138 198 L120 208 L102 198 Z" fill="url(#hana-skin)"/>
  <path d="M105 164 C114 175 126 175 135 164 L136 180 C125 187 115 187 104 180 Z" fill="#a87268" fill-opacity="0.45"/>

  <!-- Warm Youthful Anime Face -->
  <path d="M78 104 C78 74 97 58 120 58 C143 58 162 74 162 104 C162 133 149 156 131 168 C124 173 116 173 109 168 C91 156 78 133 78 104 Z" fill="url(#hana-skin)"/>
  <path d="M79 108 C80 134 92 155 109 167" fill="none" stroke="#ffd269" stroke-width="2.3" stroke-opacity="0.9"/>
  <ellipse cx="94" cy="133" rx="9.5" ry="5" fill="#ff756b" fill-opacity="0.26"/>
  <ellipse cx="146" cy="133" rx="9.5" ry="5" fill="#ff756b" fill-opacity="0.26"/>

  <!-- Bright Golden-Hazel Anime Eyes -->
  <g>
    <path d="M86 113 Q97 104 109 113 Q107 124 97.5 125 Q88 124 86 113 Z" fill="#ffffff"/>
    <ellipse cx="97.5" cy="116" rx="6.8" ry="7.5" fill="url(#hana-eye)"/>
    <ellipse cx="97.5" cy="116.5" rx="3" ry="3.5" fill="#211105"/>
    <circle cx="95" cy="113" r="2.3" fill="#ffffff"/>
    <circle cx="100.8" cy="119" r="1.2" fill="#fff3b8"/>
    <path d="M84 112 Q97 102 110 113 L108 109 Q97 100 86 108 Z" fill="#2b1510"/>
    <path d="M86 99 Q97 95 108 99" fill="none" stroke="#3b1d16" stroke-width="2.1" stroke-linecap="round"/>

    <path d="M154 113 Q143 104 131 113 Q133 124 142.5 125 Q152 124 154 113 Z" fill="#ffffff"/>
    <ellipse cx="142.5" cy="116" rx="6.8" ry="7.5" fill="url(#hana-eye)"/>
    <ellipse cx="142.5" cy="116.5" rx="3" ry="3.5" fill="#211105"/>
    <circle cx="140" cy="113" r="2.3" fill="#ffffff"/>
    <circle cx="145.8" cy="119" r="1.2" fill="#fff3b8"/>
    <path d="M156 112 Q143 102 130 113 L132 109 Q143 100 154 108 Z" fill="#2b1510"/>
    <path d="M154 99 Q143 95 132 99" fill="none" stroke="#3b1d16" stroke-width="2.1" stroke-linecap="round"/>
  </g>

  <!-- Soft Nose & Warm Smile -->
  <path d="M120 122 L118.5 133 L122 135" fill="none" stroke="#b0796d" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M108 147 Q120 156 132 147" fill="none" stroke="#9e5954" stroke-width="2.1" stroke-linecap="round"/>

  <!-- Soft Swept Bangs & Golden Ginkgo Hairpin -->
  <path d="M68 102 C70 64 92 44 120 44 C148 44 170 64 172 102 C164 82 150 70 134 68 C136 84 132 98 124 107 C124 90 118 76 110 70 C106 88 98 101 88 109 C90 92 86 78 80 72 C76 86 72 98 68 112 Z" fill="url(#hana-hair)"/>
  <path d="M88 60 Q120 50 150 62" fill="none" stroke="#ffb000" stroke-opacity="0.48" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Ginkgo Leaf Hairpin -->
  <g transform="translate(152, 82) rotate(-18)">
    <path d="M0 12 L-10 -2 C-6 -8 0 -6 2 -2 C4 -6 10 -8 12 -1 Z" fill="#ffb000" stroke="#fff2b2" stroke-width="1"/>
    <line x1="0" y1="12" x2="-4" y2="20" stroke="#ffb000" stroke-width="1.6"/>
  </g>

  <!-- Frame Corner Accent -->
  <path d="M10 270 L10 252 M10 270 L28 270" fill="none" stroke="#ffb000" stroke-width="2"/>
</svg>
