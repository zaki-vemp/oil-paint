<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Ren — Chief Architect">
  <defs>
    <linearGradient id="ren-bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#18050d"/>
      <stop offset="55%" stop-color="#110814"/>
      <stop offset="100%" stop-color="#07060c"/>
    </linearGradient>
    <radialGradient id="ren-halo" cx="0.5" cy="0.36" r="0.56">
      <stop offset="0%" stop-color="#ff2a6d" stop-opacity="0.36"/>
      <stop offset="60%" stop-color="#9e123f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff2a6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ren-skin" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#f7dfd8"/>
      <stop offset="58%" stop-color="#dfb9b2"/>
      <stop offset="100%" stop-color="#9b6e72"/>
    </linearGradient>
    <linearGradient id="ren-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#52586c"/>
      <stop offset="50%" stop-color="#2a2e3d"/>
      <stop offset="100%" stop-color="#131520"/>
    </linearGradient>
    <linearGradient id="ren-coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1422"/>
      <stop offset="55%" stop-color="#0f0b14"/>
      <stop offset="100%" stop-color="#060509"/>
    </linearGradient>
    <linearGradient id="ren-eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#59061f"/>
      <stop offset="58%" stop-color="#ff2a6d"/>
      <stop offset="100%" stop-color="#ff9ebb"/>
    </linearGradient>
  </defs>

  <!-- Aethelgard Directorate geometric backdrop -->
  <rect width="240" height="280" fill="url(#ren-bg)"/>
  <circle cx="120" cy="104" r="122" fill="url(#ren-halo)"/>
  <g stroke="#ff2a6d" stroke-opacity="0.12" stroke-width="1">
    <polygon points="120,14 214,108 120,202 26,108" fill="none"/>
    <polygon points="120,34 194,108 120,182 46,108" fill="none"/>
    <path d="M0 64h240M0 148h240M120 0v280"/>
  </g>

  <!-- Ren's Odachi blade hilt rising diagonally behind right shoulder -->
  <g transform="translate(178, 56) rotate(22)">
    <rect x="-5" y="0" width="10" height="92" fill="#17121d" stroke="#ff2a6d" stroke-width="1.5"/>
    <path d="M-5 14 L5 22 M-5 30 L5 38 M-5 46 L5 54 M-5 62 L5 70" stroke="#ff2a6d" stroke-width="1.8"/>
    <rect x="-16" y="84" width="32" height="6" rx="1" fill="#2a1c28" stroke="#ff2a6d" stroke-width="1.6"/>
    <rect x="-6" y="-6" width="12" height="8" fill="#ff2a6d"/>
  </g>

  <!-- Swept-back silver-slate hair silhouette -->
  <path d="M62 106 C52 72 74 36 120 34 C166 36 186 70 178 108 C184 138 180 172 168 196 L72 196 C60 172 56 138 62 106 Z" fill="url(#ren-hair)"/>
  <path d="M60 108 C55 138 59 168 70 194" fill="none" stroke="#ff2a6d" stroke-width="2.6" stroke-opacity="0.88"/>

  <!-- Sovereign Directorate High-Collared Coat & Armored Pauldrons -->
  <path d="M12 280 L28 220 C42 202 70 194 96 190 L144 190 C170 194 198 202 212 220 L228 280 Z" fill="url(#ren-coat)"/>
  <!-- Pauldron armor plates -->
  <path d="M18 242 L56 206 L82 218 L34 268 Z" fill="#24172b" stroke="#ff2a6d" stroke-width="1.6"/>
  <path d="M222 242 L184 206 L158 218 L206 268 Z" fill="#1d1223" stroke="#ff2a6d" stroke-opacity="0.75" stroke-width="1.6"/>
  <!-- High Architectural Collar -->
  <path d="M66 170 L98 212 L96 280 L54 244 L58 184 Z" fill="#1c1222" stroke="#ff2a6d" stroke-width="1.8"/>
  <path d="M174 170 L142 212 L144 280 L186 244 L182 184 Z" fill="#160e1c" stroke="#ff2a6d" stroke-width="1.8"/>
  <!-- Center Eternity Grid breastplate core -->
  <path d="M98 212 L142 212 L134 280 L106 280 Z" fill="#120915"/>
  <polygon points="120,222 132,238 120,254 108,238" fill="#ff2a6d" fill-opacity="0.28" stroke="#ff2a6d" stroke-width="1.8"/>
  <circle cx="120" cy="238" r="4" fill="#ff9ebb"/>

  <!-- Neck & sharp shadow -->
  <path d="M101 162 L139 162 L143 212 L120 226 L97 212 Z" fill="url(#ren-skin)"/>
  <path d="M101 164 C113 179 127 179 139 164 L140 188 C126 198 114 198 100 188 Z" fill="#6f4852" fill-opacity="0.62"/>
  <!-- Neural spine collar traces -->
  <path d="M108 188 L108 212 M120 192 L120 218 M132 188 L132 212" stroke="#ff2a6d" stroke-width="1.6" stroke-opacity="0.8"/>

  <!-- Sharp Aristocratic Anime Face -->
  <path d="M76 98 C76 68 95 52 120 52 C145 52 164 68 164 98 C164 128 151 154 131 171 C124 176 116 176 109 171 C89 154 76 128 76 98 Z" fill="url(#ren-skin)"/>
  <!-- Crimson rim highlight along left jaw -->
  <path d="M77 102 C78 130 90 153 109 170" fill="none" stroke="#ff5c8d" stroke-width="2.4" stroke-opacity="0.9"/>
  <!-- Cheekbone contour & faint neural scar -->
  <path d="M148 126 L142 142" fill="none" stroke="#b38489" stroke-width="1.2"/>
  <path d="M90 124 L98 138 L95 147" fill="none" stroke="#ff2a6d" stroke-opacity="0.6" stroke-width="1.3"/>

  <!-- Piercing Narrowed Crimson Eyes -->
  <g>
    <!-- Left Eye -->
    <path d="M85 109 L109 112 L106 120 L87 118 Z" fill="#fff5f8"/>
    <ellipse cx="98" cy="114.5" rx="5.5" ry="5.8" fill="url(#ren-eye)"/>
    <ellipse cx="98" cy="114.5" rx="2.3" ry="3.2" fill="#1a030b"/>
    <circle cx="96" cy="112.5" r="1.6" fill="#ffffff"/>
    <path d="M83 108 L111 112 L109 109 L85 105 Z" fill="#17131d"/>
    <path d="M82 99 L111 105" fill="none" stroke="#232634" stroke-width="3" stroke-linecap="square"/>

    <!-- Right Eye -->
    <path d="M155 109 L131 112 L134 120 L153 118 Z" fill="#fff5f8"/>
    <ellipse cx="142" cy="114.5" rx="5.5" ry="5.8" fill="url(#ren-eye)"/>
    <ellipse cx="142" cy="114.5" rx="2.3" ry="3.2" fill="#1a030b"/>
    <circle cx="140" cy="112.5" r="1.6" fill="#ffffff"/>
    <path d="M157 108 L129 112 L131 109 L155 105 Z" fill="#17131d"/>
    <path d="M158 99 L129 105" fill="none" stroke="#232634" stroke-width="3" stroke-linecap="square"/>
  </g>

  <!-- Neural Architect Brow Bridge & Temple Implants -->
  <g>
    <path d="M74 96 L96 101 M166 96 L144 101" stroke="#ff2a6d" stroke-width="1.8"/>
    <polygon points="120,94 125,100 120,106 115,100" fill="#ff2a6d"/>
    <circle cx="76" cy="96" r="3" fill="#ff2a6d"/>
    <circle cx="164" cy="96" r="3" fill="#ff2a6d"/>
  </g>

  <!-- Sharp Nose & Stoic Mouth -->
  <path d="M120 114 L118 134 L123 136" fill="none" stroke="#9e6f74" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M108 151 L120 149 L132 151" fill="none" stroke="#7d4a52" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M115 155 L125 155" fill="none" stroke="#b38288" stroke-width="1.2"/>

  <!-- Swept-back Hair Crown + Sharp Loose Strands -->
  <path d="M70 96 C70 64 92 40 120 40 C148 40 170 64 170 96 C163 76 148 64 128 63 C134 78 132 95 124 108 C124 88 119 72 112 65 C108 84 100 98 90 107 C92 88 89 74 82 68 C78 82 74 98 68 114 Z" fill="url(#ren-hair)"/>
  <path d="M88 54 Q120 42 152 56 M104 60 Q122 54 140 62" fill="none" stroke="#a8b2c8" stroke-opacity="0.48" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M72 68 Q84 52 104 46" fill="none" stroke="#ff2a6d" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>

  <!-- Frame Corner Accent -->
  <path d="M10 270 L10 252 M10 270 L28 270" fill="none" stroke="#ff2a6d" stroke-width="2"/>
</svg>
